# Default configuration. All paths are relative to the repo root (resolved by
# matchlive.common.config.load_config).

paths:
  dataset: dataset/organized_data
  checkpoints: checkpoints
  cache: cache
  outputs: outputs
  v2: ../live-comment-v2               # the reference implementation (scripts/compare_v2.py)

# Whole-video timestamp of each half's second 0, used only to align with the streaming-QA
# benchmark (DESIGN.md §4): timestamp = benchmark_offsets[match][half] + second.
benchmark_offsets:
  "2016-02-07 - 19-00 Chelsea 1 - 1 Manchester United": {1: 0, 2: 2700}
  "2016-09-16 - 22-00 Chelsea 1 - 2 Liverpool": {1: 0, 2: 2773}

# Loop switches (DESIGN.md §7); each is added in the phase that implements it.
loop:
  # On: proposals are matched to existing entries and checked against the constraints
  # (DESIGN.md §6.4). Off: the v2 baseline — every candidate is written as confirmed.
  consistency: true
  # On: conflict cases go to the arbiter (DESIGN.md §6.6). Off: the newest belief in a
  # conflict is rejected outright.
  arbiter: true
  # On: inferences and event participants follow the current evidence on every read.
  # Off: the forward-only baseline — once counted, an event and its players stay counted.
  cascade: true
  # On: a candidate the analyzer saw in a replay gets the interval [window start - W, window
  # end] (DESIGN.md §6.5). Off: it is taken as a live sighting at the second it was seen.
  replay: true
  # On: an entry seen only once, live, and not seen again by the next window is re-checked once
  # by the same analyzer on a window centred on that sighting; a re-check that sees it again
  # suffices (DESIGN.md §6.4). Not an independent source — a precision-for-recall trade.
  # Off: a single source leaves the entry pending.
  recheck: true
  # On: identity votes only among the players memory has on the pitch and keeps the confirmed
  # identity entries; a number worn by nobody on the pitch that names an off-pitch player is
  # evidence for the consistency check. Off: votes over the whole squad (v2).
  state_to_perception: true

# The streaming-QA agent (DESIGN.md §6.9); calls go through the `api` section's model.
qa:
  mode: tools                          # tools | dump_log (the whole event log in one call, v2)
  max_rounds: 4                        # model calls per question; the last one must answer
  max_requests: 3                      # tool requests served per round
  max_frames: 16                       # frames per get_frames / get_current_view
  current_view: 8                      # s of video get_current_view shows, up to the question time (2 fps)

# Live commentary (DESIGN.md §6.9); scripts are generated through the `api` section's model.
commentary:
  # The commentary is written a stretch of video at a time, as a script of timed phrases over all of
  # its sampled frames (events.sample_fps).
  segment: 10                          # s of video one script covers
  # s before a stretch goes on air that its script is asked for: generation and voicing must fit in
  # it (generation took 10-34 s on the trial, voicing 1-5 s). Memory then knows the stretch with
  # output_delay - budget s of hindsight.
  budget: 40
  # The generator's reasoning effort: by default the flash model thinks for 30-90 s over a stretch's
  # 20 frames (3,000+ reasoning tokens), past the budget; "low" brings it to 10-34 s (the relay does
  # not always honour it).
  reasoning: low
  # Settings over the `api` section for the scripts alone (empty: the `api` model writes them), e.g.
  # a model served locally by vLLM (scripts/serve_llm.sh, docs/SETUP.md §2) with its thinking off:
  #   {endpoint: configs/vllm.local.yaml, model: Qwen/Qwen3.8-27B-FP8,
  #    extra_body: {chat_template_kwargs: {enable_thinking: false}}}   (and reasoning: null)
  api: {}
  gap: 0.3                            # s at least between two phrases
  late: 3                              # s a phrase may start after the frame it was written for (else dropped)
  late_event: 20                       # ... a phrase saying a must-say item (news, confirmation, correction)
  context_every: 90                    # s on air between lines on how the match stands (score, counts, pressure)
  context_stale: 600                   # s after which an angle on the match may be said again unchanged
  background_every: 60                 # s on air at least between two pre-match facts said over the pictures
  recent: 120                          # s: a goal, card, penalty or substitution is news if the viewer saw it at most this long ago
  recent_minor: 30                     # s: ... a shot, corner, foul, free kick, offside (later, it is stale)
  hold: 5                              # s a pending event waits for its confirmation before it may go on air
  # A pending shot, corner, foul, ... goes on air (naming no one) after the hold. Off: minor events
  # only once confirmed — half the pending ones are false (dry runs, results §25).
  pending_minor: false
  echo: 60                             # s: a minor event this close to an aired one it repeats is not news (= consistency.pair_window)
  # News, most important first: when two events are one incident, the more important one is said.
  announce: [goal, red_card, penalty, yellow_card, substitution, injury, shot, corner, offside, free_kick, foul]
  # Aired while pending: aired again once confirmed; aired and then retracted: corrected on air.
  # (An event aired as fact is corrected whatever its type.)
  confirm: [goal, red_card, penalty, yellow_card, substitution]
  max_words: 16                        # per phrase (most are one to six words; a remark in a lull is longer)
  language: English
  history: 30                          # the last phrases shown to the generator, so it carries on and does not repeat itself
  words_per_second: 2.5                # speaking rate, for a phrase with no audio to measure
  # The broadcast output runs this far behind the live feed (DESIGN.md §6.9 D3): it absorbs the
  # 30-90 s memory needs to learn of an event, a stretch's length and its script. 60 s was too
  # short for the slowest tenth of the lines (p90 about 80 s, results §22/§25), hence 120 s (2026-10-20).
  output_delay: 120
  # The commentator's voice (text-to-speech through the api endpoints): each phrase is voiced on its
  # own, and the energy its script gives it picks the delivery instruction.
  voice:
    model: gpt-4o-mini-tts
    voice: ash
    tones:
      calm: "Live British football TV commentary in a lull (the ball out of play, a replay, a stoppage): relaxed,
        conversational, unhurried, a seasoned commentator chatting to the viewers over the crowd."
      lively: "Live British football TV commentary following the ball: quick, clipped and punchy, the natural cadence
        of a broadcast commentator calling the play as it happens, a lift on players' names; never like a narrator
        reading."
      rising: "Live British football TV commentary as an attack builds towards the box: faster and louder, urgency and
        anticipation rising in the voice."
      excited: "Live British football TV commentary at the big moment (a shot, a save, a goal): shouting with
        excitement over a roaring crowd, fast, loud, the voice soaring."

# The delayed live stream with commentary (scripts/render_stream.py).
render:
  # The broadcast's own sound under ours: with `ambience`, its commentary is taken out (source
  # separation, htdemucs) and the crowd and the pitch are kept at `ambience_volume`; otherwise the
  # whole of it, its commentators included, is kept at `background_volume`.
  ambience: true
  ambience_volume: 1.0
  background_volume: 0.15
  font_size: 30                        # subtitles on the 720p video
# LLM API (DESIGN.md §2 principle 9), called through an OpenAI-compatible endpoint; responses
# cached under paths.cache/<cache>, keyed by model + request.
api:
  # Endpoints, in a local file that is never committed (configs/*.local.yaml is gitignored); used
  # in order, the next taking over when one runs out of quota or keeps failing:
  #   endpoints:
  #     - {base_url: https://.../v1, api_key: sk-...}
  endpoint: configs/api.local.yaml
  model: gemini-3.8-flash
  cache: api
  speech_cache: tts                    # text-to-speech audio, under paths.cache
  max_attempts: 8                      # a failed attempt is retried on the next endpoint at once; after a round on all of them, with backoff (5 s doubling, at most max_backoff)
  max_backoff: 120                     # s; on a long overload with fast 503s a shorter cap gets through sooner
  timeout: 180                         # s per request; a request past it fails and is retried
  extra_body: {}                       # server-specific request fields, e.g. a local vLLM model's reasoning_effort or chat_template_kwargs

events:
  # Fixed windows over the whole half (DESIGN.md §6.2).
  window_seconds: 30
  window_overlap: 5
  sample_fps: 2                        # frames per second shown to the event analyzer (§6.3)
  replay_lookback: 90                  # W: a replayed event happened within W s before its window (§6.5)
  # A live candidate's interval is its second ± this (§5.2). A substitution takes longer: the
  # board goes up well before the players swap (30 s apart in Man City - Chelsea). Treatment of
  # an injured player can run over a minute and be reported by several windows.
  live_margin: {default: 10, substitution: 45, injury: 60}
  # The confidence-gating baseline only (DESIGN.md §10): ask the analyzer for a 0-1 confidence
  # per event. The method never does (DESIGN.md §4); false keeps the request, and its cache, as is.
  ask_confidence: false

# Consistency check (DESIGN.md §6.4); seconds are match time within a half.
consistency:
  kickoff_gap: 60                      # two goals by one team closer than this cannot both hold
  card_gap: 60                         # one player carded twice within this is checked
  pair_window: 60                      # a foul's restart follows within this; a free kick's infringement precedes it
  missing_wait: 150                    # a missing partner is judged only this long after the event (window + latency)
  substitution_limit: 3                # per team; 2015-16 Premier League
  # A conflict from per-frame perception goes to the arbiter only once this many independent
  # sources back it (DESIGN.md §6.4): an off-pitch player's number read on k different tracks.
  off_roster_k: 3
  # The confidence-gating baseline (DESIGN.md §10, MemTX-like), null for the method: a candidate
  # whose analyzer confidence reaches this is written as confirmed, any other is dropped; no
  # statuses from justifications, no constraints, no cases.
  gate: null

# Arbiter (DESIGN.md §6.6); calls go through the `api` section's model.
arbiter:
  max_rounds: 4                        # model calls per case; no verdict by then = the case stays open
  max_requests: 2                      # tool requests served per round
  max_frames: 16                       # frames per get_frames
  crops: 8                             # pictures per get_track_crops
  context: 90                          # s around the members within which other events are listed
  # Verdicts from the arbiter subagent (scripts/run_arbiter.py) have no measured API latency;
  # they take effect this many seconds after the case opened (DESIGN.md §6.10 allows a fixed value).
  fixed_latency: 30

perception:
  detection:
    model: rfdetr-2xl-1019.onnx        # under paths.checkpoints (docs/results.md §31)
    providers: [tensorrt, cuda, cpu]   # tried in this order; unavailable ones are skipped
    fp16: true                         # TensorRT only
    trt_cache: trt/rfdetr-2xl-1019_fp16  # TensorRT engine cache, under paths.cache
    confidence: 0.15

  shots:
    # Colour-histogram distance between consecutive frames. 0.3: no false cut on 41k
    # main-camera frames (match videos) or 36.7k GSR frames; hard cuts between similar
    # wide views score 0.33-0.5.
    cut_threshold: 0.3

  jersey:
    checkpoint: jersey_dinov3_convnext_tiny-20_matches_gsr.safetensors   # torch weights, export source
    model: jersey_dinov3_convnext_tiny-20_matches_gsr.onnx         # exported by scripts/export_jersey_onnx.py
    providers: [tensorrt, cuda, cpu]
    fp16: true
    trt_cache: trt/jersey_fp16
    max_batch: 32                      # crops per inference call; TensorRT engine is built for 1..max_batch

  identity:
    # Per-track votes over the cached observations (perception.identity.IdentityResolver).
    vote_every: 1                      # frames between a track's votes (v2: 15)
    jersey_min_prob: 0.9               # a number read counts as a vote at this probability
    min_number_votes: 2                # votes a number needs before it can name the player
    team_min_margin: 0.2               # (far - near) / (far + near) kit distance to vote a team
    kit_burn_in: 200                   # outfield colours seen before splitting them into two kits
    kit_adapt_rate: 0.02               # how far each confident claim moves its cluster centre
    one_player_per_track: true         # Hungarian assignment within each frame

  ball:
    # The ball is not tracked: each frame takes its best ball detection above this score
    # (SoccerNet-GSR: precision 0.84, recall 0.76 at 0.3).
    min_score: 0.3

  tracking:
    # One tracker for players and goalkeepers. BoT-SORT beats ByteTrack on SoccerNet-GSR
    # (HOTA 65.5 vs 63.6, IDSW -52%), all of it from camera-motion compensation
    # (scripts/eval_tracking_gsr.py).
    algorithm: botsort                 # botsort | bytetrack
    # Keyword arguments passed straight to the trackers library class of that name.
    bytetrack:                         # v2 values
      lost_track_buffer: 30
      track_activation_threshold: 0.5
      minimum_consecutive_frames: 2
      minimum_iou_threshold: 0.1
      high_conf_det_threshold: 0.5
    botsort:                           # library defaults, except cmc_downscale
      lost_track_buffer: 30
      track_activation_threshold: 0.7
      minimum_consecutive_frames: 2
      high_conf_det_threshold: 0.6
      enable_cmc: true
      cmc_downscale: 4                 # 720p -> 320x180 optical flow: same accuracy as 2x, ~40% cheaper
